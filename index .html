const TEXT={

ved:['到站：{stop}','At stop: {stop}'],nextSpeech:['下一站係{stop}。','The next stop is {stop}.'],stoppedSpeech:['巴士已停定，車門已開。','The bus has stopped. The doors are open.'],ring:['撳鐘','Ring bell'],ringOn:['✓ 已撳鐘','✓ Bell pressed'],exit:['落車 →','Get off →'],start:['開始搭巴士 →','Start journey →'],retry:['重新再玩 ↻','Try again ↻'],pause:['暫停','Pause'],resume:['繼續','Resume'],restart:['重新開始','Restart'],newtask:['✦ 新任務','✦ New task'],mission:['今次要去{stop}。準備好就開始。','Your destination is {stop}. Start when you are ready.'],ringMessage:['叮！已通知車長。等巴士停定同開門。','Ding! The driver has been notified. Wait for the bus to stop and the doors to open.'],paused:['遊戲已暫停。','The game is paused.'],missed:['已過站：{stop}','Missed stop: {stop}'],missedState:['已經過咗站','You missed your stop'],taskEnd:['今次任務結束','Task finished'],wrongStopTitle:['任務失敗：你落錯車喇！','Task failed: wrong stop!'],wrongStopMessage:['你落錯車喇！呢度係{stop}，今次要去{target}。加油，重新再玩過啦！','You got off at the wrong stop! This is {stop}. Your destination was {target}. Keep trying and have another go!'],wrongStopBoard:['落錯站：{stop}','Wrong stop: {stop}'],wrongStopState:['落錯車喇','Wrong stop'],noBellTitle:['今次未撳鐘，再試一次！','You forgot to ring. Try again!'],noBellMessage:['你到咗{stop}，但係今次未撳落車鐘。加油，重新再玩過，記住先撳鐘、等停定先落車。','You reached {stop}, but you did not ring the bell. Have another go: ring first, then wait for the bus to stop before getting off.'],noBellState:['未完成撳鐘步驟','Bell step missed'],failureTitle:['過咗站喇，再試一次！','Missed your stop. Try again!'],failureMessage:['啊，你已經過咗{stop}站喇，落唔到車。加油，再玩過啦！','Oh, you missed {stop} and could not get off. Keep trying! Have another go!'],successTitle:['做得好！成功落車！','Well done! You got off!'],successMessage:['做得好！你成功喺{stop}落車，識得撳鐘同等巴士停定！','Well done! You got off at {stop}. You rang the bell and waited for the bus to stop!'],againHelp:['撳「重新再玩」，或者抽一個「新任務」。','Choose Try again, or draw a New task.'],footer:['撳鐘落車 · 反應練習','Ring and get off · reaction practice'],note:['真實站名 · 隨機教學配搭 · 實際乘車請由導師陪同','Real stop names · random teaching combinations · pra let lang='zh',sound=true,announcements=true,ROUTE=[],target='',missionNumber='',targetPosition=1,active=false,paused=false,elapsed=0,lastTime=0,timer=null,ringSlot=-1,lastKey='',previousSlot=-1,sceneIndex=-1,speed='medium',reaction=null,wrong=0,outcome='',lastMessage={key:'ready',args:{}};
let current={slot:0,index:0,stopped:false,legElapsed:0,travelMs:9000};
function tr(key,args={}){let value=TEXT[key][lang==='en'?1:0];for(const [k,v]of Object.entries(args))value=value.replaceAll('{'+k+'}',v);return value}
function stopName(name){return lang==='en'?STOP_EN[STOP_NAMES.indexOf(name)]||name:name}
function choose(a){return a[Math.floor(Math.random()*a.length)]}
function randomTravel(speed,previous=0){const[min,max]=speed==='slow'?[9,16]:speed==='fast'?[4,8]:[6,12];return choose(Array.from({length:max-min+1},(_,i)=>(min+i)*1000).filter(n=>n!==previous))}
function advanceJourney(v,delta,nextTravel){const n={...v,legElapsed:v.legElapsed+delta};if(!v.stopped&&n.legElapsed>=v.travelMs)return {...n,stopped:true,legElapsed:0};if(v.stopped&&n.legElapsed>=8000)return {slot:v.slot+1,index:(v.slot+1)%ROUTE.length,stopped:false,legElapsed:0,travelMs:nextTravel};return n}
function mayExit(v){return v.stopped}
function say(text){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='en'?'en-GB':'zh-HK';u.rate=.9;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>lang==='en'?/^en-GB/i.test(v.lang):/zh[-_]HK|yue/i.test(v.lang))||voices.find(v=>lang==='en'&&/^en/i.test(v.lang));if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}

function updateLabels(){document.documentElement.lang=lang==='en'?'en':'zh-HK';document.title=tr('brand');const ids={'brand':'brand','settingsbtn':'settings','settings-title':'settings','destination-label':'destination','speed-label':'speed','motion-label':'motion','rules':'rules','voicehelp':'voiceHelp','goal-label':'goal','difficulty-label':'difficulty','board-label':'board','exit-label':'exit','restart':'restart','newtask':'newtask','footer-label':'footer','footer-note':'note'};for(const[id,key]of Object.entries(ids))$('#'+id).textContent=tr(key);$('#language').textContent=lang==='en'?'中文':'English';$('#sound').textContent=tr(sound?'soundOn':'soundOff');$('#announcement').textContent=tr(announcements?'announceOn':'announceOff');$('#announcement').setAttribute('aria-pressed',announcements);$('#bell').setAttribute('aria-label',tr('ring'));$('#exit').setAttribute('aria-label',tr('exit'));$('#exit-image').setAttribute('alt',lang==='en'?'A student safely getting off a bus':'學生安全落車嘅卡通圖畫');$('#scene').setAttribute('aria-label',lang==='en'?'Bus movement, open doors and task outcome':'巴士行駛、車門及任務結果');$('#pause').textContent=tr(paused?'resume':'pause');$('#start').textContent=tr(outcome?'retry':'start');$('#speed').querySelector('[value="slow"]').textContent=tr('slow');$('#speed').querySelector('[value="medium"]').textContent=tr('medium');$('#speed').querySelector('[value="fast"]').textContent=tr('fast');for(let i=1;i<=3;i++)$('#difficulty').querySelector('[value="'+i+'"]').textContent=tr('level'+i);const choice=$('#destination').value||'random';$('#destination').innerHTML='<option value="random">'+tr('random')+'</option>'+STOP_NAMES.map(n=>'<option value="'+n+'">'+stopName(n)+'</option>').join('');$('#destination').value=choice;$('#goalname').textContent=stopName(target);$('#scene-goalname').textContent=stopName(target);$('#scene-goal-label').textContent=tr('goal')+'：';$('#routelabel').textContent=lang==='en'?'Route '+missionNumber:missionNumber+' 號';if(active)paint(true,f function renderIdle(){const exited=outcome==='success'||outcome==='wrongStop'||outcome==='noBell',actual=outcome==='wrongStop'?ROUTE[current.index]:target;$('#display').textContent=outcome==='wrongStop'?tr('wrongStopBoard',{stop:stopName(actual)}):outcome==='failure'?tr('missed',{stop:stopName(target)}):outcome?tr('arrived',{stop:stopName(target)}):tr('ready');$('#state').textContent=tr(outcome==='wrongStop'?'wrongStopState':outcome==='noBell'?'noBellState':outcome==='failure'?'missedState':outcome==='success'?'stopped':'notStarted');$('#doorstate').textContent=tr(exited?'open':'closed');$('#scene-label').textContent=tr(outcome?'taskEnd':'ready');$('#stationtag').textContent=stopName(actual)}

function paint(force=false,voice=true){const v=current,key=v.slot+':'+v.stopped,name=ROUTE[v.index];if(key!==lastKey||force){if(v.slot!==previousSlot){ringSlot=-1;reaction=null;changeScene()}previousSlot=v.slot;lastKey=key;$('#display').textContent=tr(v.stopped?'arrived':'next',{stop:stopName(name)});$('#scene').classList.toggle('stopped',v.stopped);$('#state').textContent=tr(v.stopped?'stopped':'moving');$('#doorstate').textContent=tr(v.stopped?'open':'closed');$('#scene-label').textContent=tr(v.stopped?'sceneStopped':'sceneMoving');$('#stationtag').textContent=stopName(name);$('#helper').textContent='';message(v.stopped?'stoppedSpeech':'nextSpeech',v.stopped?{}:{stop:name},voice&&(!v.stopped?announcements:true))}setControls()}
function prepareMission(forceRandom=false){clearInterval(timer);active=false;paused=false;outcome='';ringSlot=-1;if(window.speechSynthesis)speechSynthesis.cancel();const previous=target,picked=forceRandom?'random':$('#destination').value||'random';target=picked==='random'?choose(STOP_NAMES.filter(n=>n!==previous)):picked;const level=$('#difficulty').value||'1',[min,max]=level==='3'?[10,20]:level==='2'?[5,10]:[1,5];targetPosition=min+Math.floor(Math.random()*(max-min+1));ROUTE=[];for(let i=0;i<targetPosition+2;i++)ROUTE.push(choose(STOP_NAMES.filter(n=>n!==target&&n!==ROUTE[i-1])));ROUTE[targetPosition-1]=target;missionNumber=choose(BUS_NUMBERS.filter(n=>n!==missionNumber));$('#routeplate').textContent=missionNumber;$('#busroute').textContent=missionNumber;$('#scene').classList.remove('stopped');document.body.classList.add('paused');$('#outcome').classList.add('hidden');$('#outcome').innerHTML='';$('#start').classList.remove('hidden');$('#pause').classList.add('hidden');$('#restart').classList.add('hidden');$('#helper').textContent='';current={slot:0,index:0,stopped:false,legElapsed:0,travelMs:9000};changeScene();lastMessage={key:'mission',args:{stop:target}};updateLabels()}
function start(){clearInterval(timer);speed=$('#speed').value;current={slot:0,index:0,stopped:false,legElapsed:0,travelMs:randomTravel(speed)};elapsed=0;ringSlot=-1;lastKey='';previousSlot=-1;wrong=0;reaction=null;paused=false;active=true;outcome='';$('#outcome').classList.add('hidden');$('#outcome').innerHTML='';$('#start').classList.add('hidden');$('#pause').classList.remove('hidden');$('#restart').classList.remove('hidden');document.body.classList.remove('paused');$('#pause').textContent=tr('pause');lastTime=performance.now();paint(true);timer=setInterval(tick,100)}
function tick(){if(!active||paused)return;const now=performance.now(),delta=Math.max(0,now-lastTime);elapsed+=delta;lastTime=now;const previous=current;current=advanceJourney(current,delta,randomTravel(speed,current.travelMs));if(previous.stopped&&current.slot!==previous.slot&&ROUTE[previous.index]===target){finish('failure');return}paint()}
function showOutcome(kind,animate=true){const ok=kind==='success',keys=outcomeKeys(),actual=kind==='wrongStop'?ROUTE[current.index]:target;const image=ok?'<span class="outcome-icon">🏆</span>':kind==='wrongStop'?'<span class="outcome-icon try-illustration wrong-exit-art" aria-hidden="true">🚏 🧍 ❓</span>':'<span class="outcome-icon try-illustration">🚌 💭</span>';const confetti=ok?'<div class="confetti" aria-hidden="true">'+Array.from({length:14},(_,i)=>'<i style="--i:'+i+'"></i>').join('')+'</div>':'';$('#outcome').classList.remove('hidden');$('#outcome').classList.toggle('win',ok);$('#outcome').classList.toggle('tryagain',!ok);$('#outcome').innerHTML=confetti+image+'<strong>'+tr(keys[0])+'</strong><span>'+tr(keys[1],{stop:stopName(actual),target:stopName(target)})+'</span>';$('#outcome').setAttribute('aria-label',tr(keys[0]));if(!animate)$('#outcome').classList.add('no-enter');else $('#outcome').classList.remove('no-enter')}

function finish(kind){active=false;paused=false;outcome=kind;clearInterval(timer);document.body.classList.add('paused');$('#scene').classList.toggle('stopped',kind!=='failure');$('#pause').classList.add('hidden');$('#restart').classList.add('hidden');$('#start').classList.remove('hidden');$('#start').textContent=tr('retry');renderIdle();setControls();showOutcome(kind);melody(kind==='success'?'success':'failure');message(outcomeKeys()[1],{stop:kind==='wrongStop'?ROUTE[current.index]:target,target});$('#helper').textContent=tr('againHelp')}
$('#bell').onclick=()=>{if(!active||paused)return;tick();if(!active)return;if(current.stopped){message('stoppedSpeech');return}ringSlot=current.slot;if(ROUTE[current.index]!==target)wrong++;reaction=current.legElapsed/1000;melody('bell');setControls();message('ringMessage')};
$('#exit').onclick=()=>{tick();if(active&&!paused&&mayExit(current))finish(ROUTE[current.index]!==target?'wrongStop':ringSlot!==current.slot?'noBell':'success')};
$('#newtask').onclick=()=>{$('#destination').value='random';prepareMission(true)};$('#start').onclick=start;$('#restart').onclick=start;$('#pause').onclick=()=>{if(!active)return;if(!paused){tick();if(!active)return;paused=true;document.body.classList.add('paused');message('paused',{},false)}else{paused=false;lastTime=performance.now();document.body.classList.remove('paused');paint(true)}$('#pause').textContent=tr(paused?'resume':'pause');setControls()};
$('#settingsbtn').onclick=()=>{const hidden=$('#settings').classList.toggle('hidden');$('#settingsbtn').setAttribute('aria-expanded',!hidden)};$('#destination').onchange=()=>prepareMission();$('#difficulty').onchange=()=>prepareMission();$('#motion').onchange=()=>document.body.classList.toggle('reduced',$('#motion').checked);$('#sound').onclick=()=>{sound=!sound;$('#sound').setAttribute('aria-pressed',sound);if(!sound&&window.speechSynthesis)speechSynthesis.cancel();$('#sound').textContent=tr(sound?'soundOn':'soundOff')};$('#announcement').onclick=()=>{announcements=!announcements;$('#announcement').textContent=tr(announcements?'announceOn':'announceOff');$('#announcement').setAttribute('aria-pressed',announcements);if(!announcements&&window.speechSynthesis)speechSynthesis.cancel()};$('#language').onclick=()=>{if(window.speechSynthesis)speechSynthesis.cancel();lang=lang==='zh'?'en':'zh';updateLabels()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active&&!paused)$('#pause').click()});prepareMission();
</script></body></html>
